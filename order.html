<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка – VeloShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

    <!-- Шапка -->
    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">VeloShop</h1>
            <span class="badge bg-warning text-dark">КР №2</span>
        </div>
    </header>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">VeloShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Велосипед</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заявка</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Ещё</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="catalog.html">Все велосипеды</a></li>
                            <li><a class="dropdown-item" href="order.html">Оформить заявку</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основное содержимое -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Форма заявки на велосипед</h1>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info" role="alert">
                            Заполните форму. Поля со звёздочкой являются обязательными.
                        </div>
                        
                        <form>
                            <div class="row g-3">
                                <!-- Имя -->
                                <div class="col-12 col-md-6">
                                    <label for="order-name" class="form-label">Имя *</label>
                                    <input type="text" class="form-control" id="order-name" required>
                                </div>
                                <!-- Email -->
                                <div class="col-12 col-md-6">
                                    <label for="order-email" class="form-label">E-mail *</label>
                                    <input type="email" class="form-control" id="order-email" required>
                                </div>
                                <!-- Телефон (с input-group) -->
                                <div class="col-12 col-md-6">
                                    <label for="order-phone" class="form-label">Телефон *</label>
                                    <div class="input-group">
                                        <span class="input-group-text">+7</span>
                                        <input type="tel" class="form-control" id="order-phone" placeholder="900 000-00-00" required>
                                    </div>
                                </div>
                                <!-- Выбор велосипеда -->
                                <div class="col-12 col-md-6">
                                    <label for="order-product" class="form-label">Велосипед *</label>
                                    <select class="form-select" id="order-product" required>
                                        <option selected disabled value="">Выберите модель</option>
                                        <option value="1">Trek Marlin 5</option>
                                        <option value="2">Giant Escape 3</option>
                                        <option value="3">Merida Scultura</option>
                                    </select>
                                </div>
                                <!-- Комментарий -->
                                <div class="col-12">
                                    <label for="order-comment" class="form-label">Комментарий</label>
                                    <textarea class="form-control" id="order-comment" rows="3"></textarea>
                                </div>
                                <!-- Чекбокс -->
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="order-agree" required>
                                        <label class="form-check-label" for="order-agree">Я согласен на обработку данных *</label>
                                    </div>
                                </div>
                                <!-- Кнопки -->
                                <div class="col-12 d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary">Отправить заявку</button>
                                    <button type="reset" class="btn btn-outline-secondary">Очистить</button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row align-items-center g-3">
                <div class="col-12 col-md-6">
                    <p class="mb-0">&copy; 2026 VeloShop. Учебный проект.</p>
                </div>
                <div class="col-12 col-md-6 text-md-end">
                    <a class="text-white text-decoration-none me-3" href="catalog.html">Каталог</a>
                    <a class="text-white text-decoration-none" href="order.html">Заявка</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
